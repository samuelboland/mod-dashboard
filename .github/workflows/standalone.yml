name: Standalone dashboard
on:
  pull_request:
    paths: ['standalone/**', 'web/**', 'tests/**', '.github/workflows/standalone.yml']
  push:
    paths: ['standalone/**', 'web/**', 'tests/**', '.github/workflows/standalone.yml']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: standalone
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: standalone/package-lock.json
      - run: npm ci
      - run: npm run check
